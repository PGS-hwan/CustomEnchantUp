plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.3.1'
}

group = 'com.github.hwan.customenchantup'
version = '1.1.1'
def pluginVersion = version

repositories {
    mavenLocal()
    mavenCentral()
    flatDir { dirs 'libs' }
    maven { url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/" }
    maven { url = "https://oss.sonatype.org/content/groups/public/" }
    maven { url = "https://repo.rosewooddev.io/repository/public/"}
    maven { url = "https://repo.md-5.net/content/repositories/snapshots/"}
    maven { url = "https://jitpack.io" }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:26.1-R0.1-SNAPSHOT'
    compileOnly 'com.github.YiC200333:XConomyAPI:2.19.1'
    compileOnly 'org.black_ixx:playerpoints:3.3.3'
    implementation 'com.github.cryptomorin:XSeries:13.7.1'
    implementation 'org.bstats:bstats-bukkit:3.2.1'
    implementation 'net.kyori:adventure-text-minimessage:4.17.0'
    implementation 'net.kyori:adventure-text-serializer-legacy:4.17.0'
}

tasks.named('compileJava') {
    options.encoding = 'UTF-8'
}

tasks.named('processResources') {
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand(version: pluginVersion)
    }
}

// 创建包含所有依赖的 JAR 文件
shadowJar {
    archiveFileName = "${project.name}-${project.version}.jar"
    
    relocate 'com.cryptomorin.xseries', 'com.github.hwan.customenchantup.libs.xseries'
    relocate 'org.bstats', 'com.github.hwan.customenchantup.libs.bstats'
    relocate 'net.kyori', 'com.github.hwan.customenchantup.libs.adventure'
    relocate 'parsii', 'libs.pari'
    relocate 'org.apache.commons', 'libs.org.apache.commons'
    
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    mergeServiceFiles()
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = 8
    options.compilerArgs.add('-Xlint:-options')
}

// 禁用测试任务（项目没有有效的测试）
test {
    enabled = false
}